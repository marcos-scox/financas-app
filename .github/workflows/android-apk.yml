name: Build and publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Financas.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: financas-apk
          path: dist/Financas.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION" dist/Financas.apk \
            --title "Finanças $VERSION" \
            --notes "APK Android release gerado automaticamente a partir do commit ${GITHUB_SHA}." \
            --latest
